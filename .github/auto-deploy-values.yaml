replicaCount: 1
# Stop the old web pod before repairing semantic sort keys in the new image.
strategyType: Recreate
podSecurityContext:
  fsGroup: 33
  fsGroupChangePolicy: OnRootMismatch

initContainers:
  - name: fina-smw-collation
    image: "$repository:$tag"
    imagePullPolicy: Always
    command: ["/usr/local/bin/fina-migrate", "--collation-only"]
    envFrom:
      - secretRef:
          name: "$app_name"
    securityContext:
      runAsUser: 33
      runAsGroup: 33
      runAsNonRoot: true

image:
  repository: $repository
  tag: "$tag"
  pullPolicy: Always
  secrets: []

extraLabels:
  "ID": "$service_id"

gitlab:
  app: "$app_name"
  envURL: "$repo_url"

service:
  enabled: true
  name: "web"
  url: "$public_url"
  type: ClusterIP
  externalPort: 80
  internalPort: 80

ingress:
  enabled: true
  path: "/"
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: acdh-prod

# --- STARTUP PROBE ---
startupProbe:
  enabled: true
  probeType: "exec"
  command: ["php", "/usr/local/bin/fina-healthcheck.php"]
  failureThreshold: 120
  periodSeconds: 15
  timeoutSeconds: 5
  initialDelaySeconds: 60

# --- LIVENESS PROBE ---
livenessProbe:
  enabled: true
  probeType: "tcpSocket"
  port: 80
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 5
  initialDelaySeconds: 60

# --- READINESS PROBE ---
readinessProbe:
  enabled: true
  probeType: "exec"
  command: ["php", "/usr/local/bin/fina-healthcheck.php"]
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
