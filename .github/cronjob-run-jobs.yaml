# Initially suspended: run a manual smoke test, then enable the schedule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fina-run-jobs
  namespace: fina-prod
spec:
  schedule: '* * * * *'
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            runAsNonRoot: true
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
          containers:
          - name: maintenance
            image: ghcr.io/acdh-oeaw/fina/fina:4cc7b56
            imagePullPolicy: IfNotPresent
            workingDir: /var/www/html
            envFrom:
            - secretRef:
                name: fina-prod
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '1'
                memory: 1Gi
            volumeMounts:
            - name: images
              mountPath: /var/www/html/images
            - name: rdf-dumps
              mountPath: /var/www/html/rdf-dumps
            command:
            - php
            - /var/www/html/maintenance/run.php
            - runJobs
            - --maxtime=50
            - --maxjobs=100
          volumes:
          - name: images
            persistentVolumeClaim:
              claimName: images
          - name: rdf-dumps
            persistentVolumeClaim:
              claimName: rdf-dumps