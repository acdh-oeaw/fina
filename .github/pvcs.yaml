# Existing FINA PVCs. Deployment/Helm configuration defines the mounts.
# Keep existing claim names; this file does not back up or restore volume data.

# Deployment mount: /var/www/html/images
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: images
  namespace: fina-prod
spec:
  accessModes:
  - ReadWriteOnce
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-csi-cephfs-default-2
  volumeMode: Filesystem
---
# Deployment mount: /var/www/html/rdf-dumps
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rdf-dumps
  namespace: fina-prod
spec:
  accessModes:
  - ReadWriteOnce
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-csi-cephfs-default-2
  volumeMode: Filesystem