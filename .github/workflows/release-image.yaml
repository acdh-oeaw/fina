name: Release image tag

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  release-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-fina\.[0-9]+)?$ ]]; then
            echo 'Use v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-fina.<n>' >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo 'Release tags must point to a commit on main' >&2
            exit 1
          }
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SOURCE_IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Require successful main deployment
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'starter.yaml',
              head_sha: context.sha,
              event: 'push',
              per_page: 20,
            });
            const deployed = runs.data.workflow_runs.some(
              run => run.status === 'completed' && run.conclusion === 'success'
            );
            if (!deployed) {
              core.setFailed('Wait for the main-branch deployment of this commit to succeed before tagging a release.');
            }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Tag the deployed commit image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}/fina
        run: |
          set -euo pipefail
          source_image="$IMAGE:$SOURCE_IMAGE_TAG"
          release_image="$IMAGE:$RELEASE_VERSION"
          docker buildx imagetools inspect "$source_image" >/dev/null
          if docker buildx imagetools inspect "$release_image" >/dev/null 2>&1; then
            echo "Release image already exists: $release_image" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$release_image" "$source_image"